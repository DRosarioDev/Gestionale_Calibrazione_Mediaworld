spring.application.name=calibrazione

# Porta HTTP. Render (e altri PaaS) forniscono la variabile PORT:
# in locale, se PORT non esiste, resta la 8080.
server.port=${PORT:8080}

# Profilo attivo:
#   mock     -> dati in memoria (nessun database richiesto, default)
#   postgres -> persistenza reale, vedere application-postgres.properties
# Si puo' cambiare senza toccare il file: SPRING_PROFILES_ACTIVE=postgres
spring.profiles.active=${SPRING_PROFILES_ACTIVE:mock}

# Serializzazione JSON: date ISO-8601, mai timestamp numerici.
spring.jackson.datatype.datetime.write-dates-as-timestamps=false

# Chiave e durata del token JWT.
# In produzione fornire la chiave con la variabile d'ambiente JWT_SECRET:
# il valore di default è solo per lo sviluppo locale.
app.jwt.secret=${JWT_SECRET:chiave-di-sviluppo-da-sostituire-4f8a2c9e7b1d6350}
app.jwt.expiration-hours=24
