# =====================================================================
# Profilo "postgres" - persistenza reale su PostgreSQL
# =====================================================================
# Attivazione:
#   Spring Boot:  --spring.profiles.active=postgres
#   variabile:    SPRING_PROFILES_ACTIVE=postgres
#
# Le credenziali in chiaro sono solo i valori di default per lo sviluppo
# locale e coincidono con quelli di docker-compose.yml. In produzione
# vanno sempre passate tramite variabili d'ambiente o un secret manager.
# =====================================================================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/calibrazione}
spring.datasource.username=${DB_USER:calibrazione}
spring.datasource.password=${DB_PASSWORD:calibrazione}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool di connessioni.
spring.datasource.hikari.pool-name=calibrazione-pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000

# Lo schema e' gestito da db/schema.sql: Hibernate non deve creare o
# modificare tabelle.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Esecuzione idempotente dello schema a ogni avvio. Lo stesso file viene
# eseguito anche da PostgreSQL al primo avvio del container Docker.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.encoding=UTF-8
spring.sql.init.continue-on-error=false

# Amministratore creato al primo avvio: la password viene cifrata a runtime.
# Impostare APP_SEED_ADMIN=false quando l'utente esiste gia' in produzione.
app.seed.admin.enabled=${APP_SEED_ADMIN:true}
app.seed.admin.email=${APP_ADMIN_EMAIL:admin@mediaworld.it}
app.seed.admin.password=${APP_ADMIN_PASSWORD:Admin123!}
app.seed.admin.nome=${APP_ADMIN_NOME:Marco}
app.seed.admin.cognome=${APP_ADMIN_COGNOME:Rossi}

# Dati demo (5 utenti e 20 televisioni): disattivati di default.
# Utili per provare subito il frontend su un database vuoto:
#   APP_SEED_DEMO=true
app.seed.demo.enabled=${APP_SEED_DEMO:false}
