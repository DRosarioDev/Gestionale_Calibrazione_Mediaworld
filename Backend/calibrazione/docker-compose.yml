services:
  postgres:
    image: postgres:17-alpine
    container_name: calibrazione-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-calibrazione}
      POSTGRES_USER: ${POSTGRES_USER:-calibrazione}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-calibrazione}
      TZ: ${TZ:-Europe/Rome}
      PGTZ: ${TZ:-Europe/Rome}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Dati persistenti: sopravvivono a "docker compose down".
      - calibrazione_pgdata:/var/lib/postgresql/data
      # Schema applicato solo al primo avvio, quando il volume e' vuoto.
      # Lo stesso file viene rieseguito da Spring Boot (idempotente).
      - ./src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-calibrazione} -d ${POSTGRES_DB:-calibrazione}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  calibrazione_pgdata:
