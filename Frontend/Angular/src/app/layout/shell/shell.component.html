<div class="layout">
  <app-sidebar [aperta]="sidebarAperta()" (chiuso)="sidebarAperta.set(false)"></app-sidebar>

  @if (sidebarAperta()) {
    <button
      type="button"
      class="velo"
      aria-label="Chiudi menu"
      (click)="sidebarAperta.set(false)"
    ></button>
  }

  <div class="area-principale">
    <app-topbar (apriMenu)="sidebarAperta.set(true)"></app-topbar>
    <main class="pagina">
      <router-outlet></router-outlet>
    </main>
    <footer class="pie">
      <span>© {{ anno }} MediaWorld · Calibration Suite</span>
      <span class="separatore-punto"></span>
      <span>Uso interno · v1.0</span>
    </footer>
  </div>
</div>
